<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta tu resultado — Proceso ETB · Americas BPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F3A;--navy-2:#132B4D;--navy-3:#0F2444;--teal:#00C2B2;--white:#FFF;
--grey:#9BA9BD;--lgrey:#D6DEE8;--amber:#FFB84D;--green:#3DD68C}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--navy);color:var(--white);
line-height:1.55;-webkit-font-smoothing:antialiased;padding:0 0 60px;min-height:100vh}
.topbar{height:6px;background:var(--teal)}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
header{padding:40px 0 26px;text-align:center}
.eyebrow{font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.16em;
text-transform:uppercase;color:var(--teal);margin-bottom:12px}
h1{font-size:29px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
h1 .accent{color:var(--teal)}
.sub{margin-top:12px;color:var(--grey);font-size:15px}
.card{background:var(--navy-2);border-radius:8px;padding:26px 24px;margin-top:8px}
label{display:block;font-size:14px;font-weight:500;margin-bottom:8px}
.hint{display:block;font-weight:400;font-size:12.5px;color:var(--grey);margin-top:2px}
input{width:100%;padding:15px 16px;background:var(--navy-3);
border:1px solid rgba(255,255,255,.14);border-radius:5px;color:var(--white);
font-family:'Roboto Mono',monospace;font-size:19px;letter-spacing:.06em;
transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#5E7089;letter-spacing:normal;font-family:'Poppins',sans-serif;font-size:15px}
input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,194,178,.16)}
button{width:100%;padding:16px;margin-top:16px;background:var(--teal);color:var(--navy);
border:none;border-radius:5px;font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;
cursor:pointer;transition:background .15s,transform .08s}
button:hover{background:#00D9C7}
button:active{transform:translateY(1px)}
button:disabled{background:#2A4460;color:#6C7F96;cursor:not-allowed}
.btn-sec{background:transparent;color:var(--lgrey);border:1px solid rgba(255,255,255,.22);font-weight:500}
.btn-sec:hover{background:transparent;border-color:var(--teal);color:var(--white)}
#resultado{margin-top:22px;display:none}
#resultado.visible{display:block;animation:sube .35s ease-out}
@keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.res{border-radius:8px;padding:26px 24px;text-align:center}
.res .ico{width:60px;height:60px;margin:0 auto 18px;border-radius:50%;
display:flex;align-items:center;justify-content:center;font-size:27px}
.res h2{font-size:22px;font-weight:700;margin-bottom:12px;line-height:1.3}
.res p{font-size:14.5px;color:var(--lgrey);margin-bottom:0}
.ok{background:rgba(61,214,140,.10);border:1px solid rgba(61,214,140,.35)}
.ok .ico{background:rgba(61,214,140,.16);border:2px solid var(--green);color:var(--green)}
.no{background:var(--navy-2);border:1px solid rgba(255,255,255,.14)}
.no .ico{background:rgba(155,169,189,.14);border:2px solid var(--grey);color:var(--grey)}
.nf{background:rgba(255,184,77,.09);border:1px solid rgba(255,184,77,.35)}
.nf .ico{background:rgba(255,184,77,.16);border:2px solid var(--amber);color:var(--amber)}
.esp{background:rgba(0,194,178,.07);border:1px solid rgba(0,194,178,.30)}
.esp .ico{background:rgba(0,194,178,.14);border:2px solid var(--teal);color:var(--teal)}
.detalle{margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.12);text-align:left}
.detalle h3{font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.14em;
text-transform:uppercase;color:var(--teal);font-weight:500;margin-bottom:14px}
.dato{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;font-size:14px}
.dato:last-child{margin-bottom:0}
.dato .ic{width:20px;flex-shrink:0;text-align:center}
.dato span{color:var(--lgrey)}
.dato strong{font-weight:600;color:var(--white)}
.error{display:none;margin-top:14px;padding:12px 14px;background:rgba(255,184,77,.12);
border-left:3px solid var(--amber);border-radius:4px;font-size:13.5px}
.error.visible{display:block}
.pie{margin-top:24px;text-align:center;font-size:12.5px;color:var(--grey);line-height:1.6}
@media (max-width:520px){header{padding:30px 0 20px}h1{font-size:24px}.card,.res{padding:22px 19px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="topbar"></div>
<div class="wrap">

  <header>
    <div class="eyebrow">Americas BPS · Campaña ETB</div>
    <h1>Consulta el estado de tu <span class="accent">postulación</span></h1>
    <p class="sub">Ingresa tu número de documento para conocer el resultado del proceso.</p>
  </header>

  <div class="card" id="buscador">
    <label for="ced">Número de documento
      <span class="hint">Sin puntos ni comas</span>
    </label>
    <input type="text" id="ced" inputmode="numeric" placeholder="Ej. 1012345678" autocomplete="off" maxlength="12">
    <button id="btn">Consultar</button>
    <div class="error" id="err"></div>
  </div>

  <div id="resultado"></div>

  <p class="pie">
    Gracias por participar en nuestro proceso de selección.
  </p>

</div>

const SALT = "abps-etb-2026";

const input = document.getElementById('ced');
const btn   = document.getElementById('btn');
const err   = document.getElementById('err');
const out   = document.getElementById('resultado');

input.addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g,''); });
input.addEventListener('keydown', e => { if (e.key === 'Enter') consultar(); });
btn.addEventListener('click', consultar);

async function hash(txt){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(SALT + txt));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('').slice(0,16);
}

async function consultar(){
  err.classList.remove('visible');
  out.classList.remove('visible');
  const ced = input.value.trim();

  if (ced.length < 5) {
    err.textContent = 'Escribe tu número de documento completo, sin puntos ni comas.';
    err.classList.add('visible');
    return;
  }

  btn.disabled = true; btn.textContent = 'Consultando…';
  const h = await hash(ced);
  const estado = TABLA[h];

  setTimeout(() => {
    btn.disabled = false; btn.textContent = 'Consultar';
    if (estado === 1)      out.innerHTML = APTO;
    else if (estado === 0) out.innerHTML = NOAPTO;
    else if (estado === 2) out.innerHTML = NOCONFIRMO;
    else                   out.innerHTML = NOREGISTRADO;
    out.classList.add('visible');
    out.scrollIntoView({behavior:'smooth', block:'center'});
  }, 450);
}
